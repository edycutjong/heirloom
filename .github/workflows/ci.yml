name: ci

# Six stages. Quality and Security run in parallel; Build needs both; E2E and Performance run against the built site;
# the Deploy Gate (main only) passes only when every stage did. GitHub Pages itself deploys from pages.yml.
#
#   1 Quality ──┐
#               ├──> 3 Build ──> 4 E2E ──┬──> 6 Deploy Gate (main)
#   2 Security ─┘          └──> 5 Performance (advisory)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── STAGE 1: Quality ─────────────────────────────────────────────────────────────────────────────────────────────
  quality:
    name: "1 · Quality (forge fmt/build/test/coverage, TS typecheck + unit coverage)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0  # pinned: coverage branch counting differs between forge releases
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: forge fmt --check (both profiles; deployed sources are frozen, see foundry.toml)
        run: forge fmt --check && FOUNDRY_PROFILE=kit forge fmt --check
      - name: forge test (contracts)
        run: forge test
      - name: forge test (reactive-kit)
        run: FOUNDRY_PROFILE=kit forge test
      - name: forge coverage gate — src/ (100% lines, functions, branches; one unreachable branch allowed by name)
        run: |
          forge coverage --report summary --report lcov --no-match-coverage '(script|test|lib)/'
          python3 scripts/coverage-gate.py lcov.info --include '^src/' --allow-branch src/HeirloomReactive.sol:509
          mv lcov.info lcov-src.info
      - name: forge coverage gate — reactive-kit contracts
        run: |
          FOUNDRY_PROFILE=kit forge coverage --report summary --report lcov --no-match-coverage '(test|lib)/'
          python3 scripts/coverage-gate.py lcov.info --include '^packages/reactive-kit/src/' --exclude '/test/'
          mv lcov.info lcov-kit.info
      - name: TypeScript typecheck
        run: pnpm typecheck
      - name: TypeScript unit tests (vitest, coverage thresholds 100)
        run: pnpm test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            lcov-src.info
            lcov-kit.info
            coverage/
          if-no-files-found: ignore

  # ── STAGE 2: Security ────────────────────────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: "2 · Security: gitleaks (full history)"
    uses: ./.github/workflows/gitleaks.yml

  dependency-audit:
    name: "2 · Security: pnpm audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (high and critical fail the stage)
        run: pnpm audit --audit-level high

  slither:
    name: "2 · Security: Slither (advisory)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0  # pinned: coverage branch counting differs between forge releases
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install slither-analyzer
      - name: slither (medium+ severity, src/ only; findings are triaged by hand, never block)
        run: slither . --config-file slither.config.json --fail-none

  # ── STAGE 3: Build ───────────────────────────────────────────────────────────────────────────────────────────────
  build:
    name: "3 · Build (contracts + Pages site)"
    needs: [quality, secret-scan, dependency-audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0  # pinned: coverage branch counting differs between forge releases
      - name: forge build --sizes (EIP-170 size check for every deployable contract)
        run: forge build --sizes
      - name: Shell scripts parse
        run: for f in scripts/*.sh script/*.sh; do bash -n "$f"; done
      - name: Assemble the Pages site
        run: sh scripts/build-site.sh
      - name: Every local link and asset on the site resolves
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path("_site"); bad = []
          for page in root.rglob("*.html"):
              for ref in re.findall(r'(?:href|src)="([^"#?]+)', page.read_text()):
                  if re.match(r"^(https?:|mailto:|data:|//)", ref): continue
                  # site-absolute paths (404.html) are served under the Pages project path /heirloom/
                  target = (root / ref.removeprefix("/heirloom/").lstrip("/")) if ref.startswith("/") else (page.parent / ref)
                  target = target.resolve()
                  if target.is_dir(): target = target / "index.html"
                  if not target.exists(): bad.append(f"{page.relative_to(root)} -> {ref}")
          print("\n".join(bad) or "all local links resolve"); sys.exit(1 if bad else 0)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site/
          include-hidden-files: true

  # ── STAGE 4: E2E ─────────────────────────────────────────────────────────────────────────────────────────────────
  e2e:
    name: "4 · E2E (Playwright: landing, deck, /judge/, status card)"
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  # ── STAGE 5: Performance ─────────────────────────────────────────────────────────────────────────────────────────
  performance:
    name: "5 · Performance (Lighthouse CI, advisory)"
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: _site
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Lighthouse CI (landing, /judge/, deck)
        continue-on-error: true
        run: npx --yes @lhci/cli@0.16.1 autorun --config=lighthouserc.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore

  # ── STAGE 6: Deploy Gate ─────────────────────────────────────────────────────────────────────────────────────────
  deploy-gate:
    name: "6 · Deploy Gate (main)"
    needs: [quality, secret-scan, dependency-audit, slither, build, e2e, performance]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Every stage passed
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          cat > gate.py <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          lines = ["| stage | result |", "|---|---|"] + [f"| {k} | {v['result']} |" for k, v in needs.items()]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          sys.exit(0 if all(v["result"] == "success" for v in needs.values()) else 1)
          PY
          python3 gate.py
