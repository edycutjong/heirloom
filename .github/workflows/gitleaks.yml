name: gitleaks

# Secret scan over the FULL history (every branch and tag), required before any private → public flip.
# ci.yml calls this as its Stage 2 secret scan, so a push is scanned once; the weekly run catches new rules.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks detect --log-opts=--all
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks detect --source . --log-opts="--all" --gitleaks-ignore-path .gitleaksignore --redact --no-banner
