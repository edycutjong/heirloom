name: pages
# Publishes the landing + judge page (docs/), the deck (docs/pitch/) and the status card (status/) to GitHub Pages.
# The latest release tag is stamped into the pages at build time (scripts/build-site.sh); release.yml re-runs this
# workflow after each release, and the pages refresh the tag from the GitHub API at runtime.
on:
  push:
    branches: [main]
    paths: ["docs/**", "status/**", "scripts/build-site.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags, for the build-time release tag
      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || true) sh scripts/build-site.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
