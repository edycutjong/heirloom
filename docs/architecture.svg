<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d" font-family="Work Sans, Helvetica, Arial, sans-serif">
  <title id="t">Heirloom architecture</title>
  <desc id="d">Origin-chain token transfers and a Chainlink canary flow into the Reactive Network, where HeirloomReactive decides, then a callback through the Base proxy updates HeirloomVault, which the heir claims from. The vault's own events flow back to the reactive contract.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4A3E8C"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8E2B1D"/></marker>
  </defs>
  <rect width="960" height="560" fill="#FBF8F1"/>
  <g font-size="12" fill="#2B2620">
    <!-- zones -->
    <rect x="20" y="40" width="250" height="480" rx="6" fill="none" stroke="#B9B09F" stroke-dasharray="5 4"/>
    <rect x="300" y="40" width="360" height="480" rx="6" fill="none" stroke="#4A3E8C" stroke-dasharray="5 4"/>
    <rect x="690" y="40" width="250" height="480" rx="6" fill="none" stroke="#8E2B1D" stroke-dasharray="5 4"/>
    <g font-size="11" letter-spacing="1.5" font-weight="600">
      <text x="34" y="62" fill="#6B6253">ORIGIN CHAINS (WATCHED)</text>
      <text x="314" y="62" fill="#4A3E8C">REACTIVE NETWORK (BEFORE: DECIDES)</text>
      <text x="704" y="62" fill="#8E2B1D">BASE (AFTER: RELEASES)</text>
    </g>
    <!-- origins -->
    <rect x="40" y="90" width="210" height="96" rx="4" fill="#fff" stroke="#6B6253"/>
    <text x="52" y="112" font-weight="600">Allowlisted ERC-20s</text>
    <text x="52" y="132">Transfer(from = owner), value &gt; 0</text>
    <text x="52" y="150">Base, Ethereum, Unichain (Sepolia)</text>
    <text x="52" y="170" fill="#6B6253">zero-value spoofs are refused</text>
    <rect x="40" y="230" width="210" height="76" rx="4" fill="#fff" stroke="#6B6253"/>
    <text x="52" y="252" font-weight="600">Chainlink aggregator (canary)</text>
    <text x="52" y="272">AnswerUpdated, owner-independent</text>
    <text x="52" y="290" fill="#6B6253">proves the network can hear a chain</text>
    <rect x="40" y="350" width="210" height="60" rx="4" fill="#fff" stroke="#6B6253"/>
    <text x="52" y="372" font-weight="600">CRON topic (fixed tier)</text>
    <text x="52" y="392" fill="#6B6253">the only clock: silence, grace, attest</text>
    <!-- reactive -->
    <rect x="320" y="90" width="320" height="64" rx="4" fill="#fff" stroke="#4A3E8C"/>
    <text x="332" y="112" font-weight="600">System contract 0x8888…8888</text>
    <text x="332" y="132">subscribe · unsubscribe · requestCallbackV_1_0</text>
    <rect x="320" y="200" width="320" height="176" rx="4" fill="#EFEBF7" stroke="#4A3E8C" stroke-width="1.5"/>
    <text x="332" y="222" font-weight="600" fill="#4A3E8C">HeirloomReactive.react()</text>
    <text x="332" y="244">1 filter first: allowlist, owner, value &gt; 0</text>
    <text x="332" y="262">2 lastSeen = latest accepted proof of life</text>
    <text x="332" y="280">3 phase: ARMED → GRACE → EXPIRED → DONE</text>
    <text x="332" y="298">4 silence timer on CRON, canary-capped freeze</text>
    <text x="332" y="316">5 callback awaiting Ack, resent on a tick</text>
    <text x="332" y="334">6 spam brake bounds refused reacts per token</text>
    <text x="332" y="358" fill="#6B6253">emits Seen · SpoofRefused · CallbackSent · Acked</text>
    <!-- base -->
    <rect x="710" y="90" width="210" height="60" rx="4" fill="#fff" stroke="#8E2B1D"/>
    <text x="722" y="112" font-weight="600">Callback proxy</text>
    <text x="722" y="132">both guards on every sync()</text>
    <rect x="710" y="200" width="210" height="176" rx="4" fill="#F8E9E5" stroke="#8E2B1D" stroke-width="1.5"/>
    <text x="722" y="222" font-weight="600" fill="#8E2B1D">HeirloomVault</text>
    <text x="722" y="244">ARMED → GRACE → CLAIMABLE</text>
    <text x="722" y="262">→ CLAIM_PENDING → RELEASED</text>
    <text x="722" y="284">ping() / setAllowlist: owner channel</text>
    <text x="722" y="302">owner withdraws at any time</text>
    <text x="722" y="320">capped deposits (tiny vault)</text>
    <text x="722" y="344" fill="#6B6253">emits OwnerActive · Ack ·</text>
    <text x="722" y="360" fill="#6B6253">EstateReleased · Retired</text>
    <rect x="710" y="420" width="210" height="76" rx="4" fill="#fff" stroke="#8E2B1D"/>
    <text x="722" y="442" font-weight="600">Heir wallet</text>
    <text x="722" y="462">initiateClaim → claimDelay →</text>
    <text x="722" y="480">finalizeClaim (payout to heir only)</text>
  </g>
  <!-- arrows -->
  <g fill="none" stroke="#4A3E8C" stroke-width="1.6" marker-end="url(#a)">
    <path d="M250 138 C285 138 290 122 320 122"/>
    <path d="M250 268 C290 268 290 140 320 140" stroke-dasharray="4 3"/>
    <path d="M250 380 C290 380 290 148 320 148" stroke-dasharray="4 3"/>
    <path d="M480 154 V200"/>
  </g>
  <g fill="none" stroke="#8E2B1D" stroke-width="1.6" marker-end="url(#b)">
    <path d="M640 250 C675 250 680 120 710 120"/>
    <path d="M815 150 V200"/>
    <path d="M815 420 V376"/>
  </g>
  <g fill="none" stroke="#4A3E8C" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)">
    <path d="M710 352 C670 352 670 112 640 108"/>
  </g>
  <g font-size="11" fill="#2B2620">
    <text x="258" y="130" text-anchor="start">log</text>
    <text x="650" y="196" fill="#8E2B1D">sync()</text>
    <text x="647" y="318" fill="#4A3E8C">vault</text><text x="647" y="331" fill="#4A3E8C">events</text>
    <text x="492" y="182" fill="#4A3E8C">react(LogRecord)</text>
  </g>
  <text x="20" y="544" font-size="11" fill="#6B6253">Solid arrows: control flow. Dashed: subscribed logs. sync kinds: ATTEST, GRACE, CANCEL, EXPIRE, REVIVE. Callback gasLimit 1,000,000.</text>
  <text x="20" y="22" font-size="14" font-weight="600" fill="#2B2620">Heirloom: a dead-man's switch that reads silence across chains, with no keeper and no check-in button</text>
</svg>
