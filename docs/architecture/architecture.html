<title id="architecture-title">Heirloom architecture: one loop, three chains</title>
<desc id="architecture-desc">Heirloom's loop across three chains. 1: the owner's allowlisted token transfers on Ethereum Sepolia and Base Sepolia are subscribed logs; a $0 transfer is refused. 2 to 4: on Reactive Lasna, HeirloomReactive.react() filters first (SpoofRefused), stamps lastSeen, times the silence on Cron ticks through ARMED, GRACE and EXPIRED, with a Chainlink canary that can freeze the clock once, and calls back to Base with requestCallbackV_1_0. On Base Sepolia the callback proxy calls sync(rvm, snapshot) on HeirloomVault, whose states run ARMED, GRACE, CLAIMABLE (both by sync), CLAIM_PENDING (initiateClaim) and RELEASED (finalizeClaim); the vault emits OwnerActive and Ack back to react(). 5: the heir stub, where anyone may press either claim step and the payout goes only to the heir.</desc>
