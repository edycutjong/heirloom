<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Heirloom — releases a vault on Base to your heir once your wallet goes quiet across chains. The card's violet stamps stop; a stranger's $0 row is refused; silence outlasts grace; the oxblood RELEASED stamp lands.">
<!-- STORYBOARD (dur 6s — must equal this file's single master dur)
  0-10%   steady state: the vault drawer, the access card with two violet visit stamps (armed), the heir stub attached
  10-25%  trigger:      a stranger's $0 row types in, a strike rule draws through it, a muted refused stamp thuds   data-story="beat-2"
  25-55%  mechanism:    The card's violet stamps stop; a stranger's $0 row is refused; silence outlasts grace; the oxblood RELEASED stamp lands.   data-story="beat-3"
           (25-43% pencil tally of quiet days · 45.5% dashed DORMANT = grace · 50% RELEASED slams, ink ripple, card shake)
  55-80%  resolution:   the heir stub tears free along the perforation and a violet PAID stamp lands on it; RELEASED stays   data-story="beat-4"
  80-100% breathe + seam fade: RELEASED glow breath 80-90% (beat-5) · story fades 92-97.5% while the stub re-seats · seam
-->
